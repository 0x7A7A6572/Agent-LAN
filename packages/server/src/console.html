<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>multi-agent-connect 控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Consolas, "Microsoft YaHei", monospace;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 12px;
  }
  h1 { font-size: 16px; color: #58a6ff; }
  #summary { font-size: 13px; color: #8b949e; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px; overflow-y: auto; flex: 0 0 auto; max-height: 45vh;
  }
  .host {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: #e6edf3;
    padding: 8px 4px 2px; border-bottom: 1px solid #21262d;
    margin-top: 6px;
  }
  .host.online .hdot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .host.offline .hdot { background: #6e7681; }
  .hdot { width: 10px; height: 10px; border-radius: 3px; }
  .hbadge {
    font-size: 11px; font-weight: 400; color: #8b949e;
    border: 1px solid #30363d; border-radius: 10px; padding: 1px 8px;
  }
  .agent {
    border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px;
    background: #161b22; transition: border-color .3s;
  }
  .agent.online { border-color: #2ea043; }
  .agent.offline { border-color: #30363d; opacity: .55; }
  .agent h2 { font-size: 14px; color: #e6edf3; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #30363d; flex: 0 0 auto; }
  .online .dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .offline .dot { background: #6e7681; }
  .agent .url { font-size: 12px; color: #8b949e; word-break: break-all; }
  .agent .meta { font-size: 11px; color: #6e7681; margin-top: 4px; }
  .agent .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 10px;
    border: 1px solid #30363d; color: #8b949e; margin-left: auto;
  }
  .say { display: flex; gap: 6px; margin-top: 8px; }
  .say input {
    flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    color: #c9d1d9; font-size: 12px; padding: 4px 8px; outline: none;
  }
  .say input:focus { border-color: #58a6ff; }
  .say button {
    background: #21262d; border: 1px solid #30363d; border-radius: 6px;
    color: #c9d1d9; font-size: 12px; padding: 4px 10px; cursor: pointer;
  }
  .say button:hover { background: #30363d; }
  #logbox {
    flex: 1; overflow-y: auto; background: #010409; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.7;
  }
  #logbox div { white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>multi-agent-connect 连接组</h1>
  <div id="summary">连接中…</div>
  <div id="grid"></div>
  <div id="logbox"></div>
<script>
  const grid = document.getElementById("grid");
  const summary = document.getElementById("summary");
  const logbox = document.getElementById("logbox");
  let lastCount = -1;

  function render(presences) {
    const online = presences.filter(p => p.online);
    const hosts = new Set(presences.map(p => p.card.host || p.card.url));
    const onlineHosts = new Set(presences.filter(p => p.online).map(p => p.card.host || p.card.url));
    summary.textContent =
      online.length + " 在线 / " + presences.length + " 节点 · " +
      onlineHosts.size + "/" + hosts.size + " 台主机 · 每 10s 心跳";
    grid.innerHTML = "";
    // 按主机分组：主机头 + 组内 agent 卡片
    const groups = new Map();
    for (const p of presences) {
      const h = p.card.host || p.card.url;
      if (!groups.has(h)) groups.set(h, []);
      groups.get(h).push(p);
    }
    for (const [host, members] of groups) {
      const anyOn = members.some(p => p.online);
      const head = document.createElement("div");
      head.className = "host " + (anyOn ? "online" : "offline");
      head.innerHTML =
        "<span class='hdot'></span>" + esc(host) +
        "<span class='hbadge'>" + members.filter(p => p.online).length + "/" + members.length + " 在线</span>";
      grid.appendChild(head);
      for (const p of members) {
        const div = document.createElement("div");
        div.className = "agent " + (p.online ? "online" : "offline");
        const seen = new Date(p.lastSeen).toLocaleTimeString("zh-CN", { hour12: false });
        div.innerHTML =
          "<h2><span class='dot'></span>" + esc(p.card.name) +
          "<span class='badge'>" + (p.online ? "在线" : "离线") + "</span></h2>" +
          "<div class='meta'>" + esc(p.card.description || "") + " · 心跳 " + seen + "</div>" +
          "<div class='say'><input placeholder='留言插话…' data-to='" + esc(p.card.name) + "'><button data-to='" + esc(p.card.name) + "'>发送</button></div>";
        grid.appendChild(div);
      }
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function appendLog(line) {
    const div = document.createElement("div");
    div.textContent = line;
    logbox.appendChild(div);
    while (logbox.children.length > 300) logbox.firstChild.remove();
    logbox.scrollTop = logbox.scrollHeight;
  }

  // SSE 实时名册
  const es = new EventSource("/console/presence/stream");
  es.onmessage = e => {
    try { render(JSON.parse(e.data).presences || []); } catch {}
  };
  es.onerror = () => { summary.textContent = "连接中断，重连中…"; };

  async function sendMessage(to, text) {
    if (!text) return;
    try {
      const r = await fetch("/", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "mailbox/send",
          params: { to, text, from: "human-console" } })
      }).then(r => r.json());
      if (r.error) appendLog("[mail] 发送失败: " + r.error.message);
      else appendLog("[mail] 我 -> " + to + ": " + text);
    } catch (e) { appendLog("[mail] 发送失败: " + e.message); }
  }
  grid.addEventListener("click", e => {
    const btn = e.target.closest("button[data-to]");
    if (!btn) return;
    const input = div_inputOf(btn);
    sendMessage(btn.dataset.to, input.value.trim());
    input.value = "";
  });
  grid.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const input = e.target.closest("input[data-to]");
    if (!input) return;
    sendMessage(input.dataset.to, input.value.trim());
    input.value = "";
  });
  function div_inputOf(btn) {
    return btn.parentElement.querySelector("input");
  }

  // 日志：进页面拉一次全量，之后每 2s 轮询增量（简单可靠）
  let logCount = 0;
  async function pollLogs() {
    try {
      const r = await fetch("/console/logs").then(r => r.json());
      const fresh = (r.logs || []).slice(logCount);
      for (const l of fresh) appendLog(l);
      logCount = (r.logs || []).length;
    } catch {}
  }
  pollLogs();
  setInterval(pollLogs, 2000);
</script>
</body>
</html>
